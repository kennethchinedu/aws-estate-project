name: Terraform Organization Plan

on:
  pull_request:
    paths:
      - "live/management/eu-west-2/organization/**"
      - "modules/**"
      - "policies/**"
      - ".github/workflows/terraform-organization.yml"


permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: arn:aws:iam::763054201886:role/ci-plan
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.16.4


      - name: Terraform Init
        run: terraform -chdir=live/management/eu-west-2/organization init -input=false

      - name: Terraform Plan
        run: terraform -chdir=live/management/eu-west-2/organization plan -input=false
