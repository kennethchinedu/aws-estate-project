name: Terraform Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.16.4

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack:
          - live/management/eu-west-2/bootstrap
          - live/management/eu-west-2/landing-zone
          - live/management/eu-west-2/organization
          - live/management/eu-west-2/accounts
          - live/management/eu-west-2/cicd
          - live/management/eu-west-2/detection
          - live/payments-dev/eu-west-2/network
          - live/payments-dev/eu-west-2/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
        with:
          terraform_version: 1.16.4

      - name: Terraform init
        run: terraform -chdir=${{ matrix.stack }} init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.stack }} validate

  trivy:
    name: Trivy IaC scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  checkov:
    name: Checkov Policy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.30

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --external-checks-dir policies/checkov \
            --check CKV2_CUSTOM_1,CKV2_CUSTOM_2,CKV2_CUSTOM_3,CKV2_CUSTOM_4,CKV2_CUSTOM_5 \
            --compact 
            
