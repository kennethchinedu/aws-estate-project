
metadata:
  id: CKV2_CUSTOM_5
  name: Ensure S3 buckets block all public access
  category: GENERAL_SECURITY

definition:
  and:
    - cond_type: connection
      resource_types:
        - aws_s3_bucket
      connected_resource_types:
        - aws_s3_bucket_public_access_block
      operator: exists

    - cond_type: attribute
      resource_types:
        - aws_s3_bucket_public_access_block
      attribute: block_public_acls
      operator: equals
      value: "true"

    - cond_type: attribute
      resource_types:
        - aws_s3_bucket_public_access_block
      attribute: ignore_public_acls
      operator: equals
      value: "true"

    - cond_type: attribute
      resource_types:
        - aws_s3_bucket_public_access_block
      attribute: block_public_policy
      operator: equals
      value: "true"

    - cond_type: attribute
      resource_types:
        - aws_s3_bucket_public_access_block
      attribute: restrict_public_buckets
      operator: equals
      value: "true"
